      <p class="poem-index-num">No. 20 of 51</p>
      <h1 class="poem-title">给O娘的信件</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">背后的房门拴住了我的气球<br>一群糖果从苦力三轮车上跳落下台阶<br>橙子，橙子，锁住的月亮<br>以情趣肆虐的木马，来回如钟舌般晃动<br>滴答，滴答，一间冰凉的作坊<br>O 娘，我与你仅隔一个潮湿的仰角<br>和一架沉没的钢琴，<br>而我的灵巧能使杀人的青砖发声——</p>
        <p class="poem-line">就在你今夜相似却不相同的整圆<br>就在你金色的赤裸与金色的沉默</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
