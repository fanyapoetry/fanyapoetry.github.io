      <p class="poem-index-num">No. 30 of 51</p>
      <h1 class="poem-title">一天</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">我按住我沉默的<br>太阳穴 那里蜷着一只<br>沉默的兔子 身上只剩下<br>一具身体 毛茸的心脏<br>微弱地跳动</p>
        <p class="poem-line">哪一天 他们担着架子<br>收走了我的书籍<br>兔子就钻进门前的<br>花地 再也不出现</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
