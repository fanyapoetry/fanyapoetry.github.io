      <p class="poem-index-num">No. 33 of 51</p>
      <h1 class="poem-title">摆渡</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">我在渡口排队的时候，看见<br>滩涂的螃蟹，分捡晒干的葡萄<br>和人们丢下的烟头。<br>当地人拎着腥味的大小包裹，消失在<br>异乡的口音中，像黄色海风下<br>黄色的海。</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
