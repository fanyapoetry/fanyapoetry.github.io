      <p class="poem-index-num">No. 32 of 51</p>
      <h1 class="poem-title">抛开书本上街去</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">你漂浮着如<br>深蓝色充气的<br>床垫 认真地<br>对着渔网<br>手淫</p>
        <p class="poem-line">想象<br>一摞受潮的杂志<br>封面 古铜色<br>已不再新鲜</p>
        <p class="poem-line">便宜的<br>电子手表 准确预告了<br>一个人体艺术的<br>下午</p>
        <p class="poem-line">你在 轮胎之中<br>扑腾<br>而它径自 蒙上了灰<br>在离岸不远的深处</p>
        <p class="poem-line">在墓石垒的<br>缝隙  每一篮<br>螺蛳的潜伏之地</p>
        <p class="poem-line">蚊虫 涉过水面<br>你漂浮<br>在被阳光遗漏的<br>水域</p>
        <p class="poem-line">那里的温度<br>比来世更低</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
