      <p class="poem-index-num">No. 24 of 52</p>
      <h1 class="poem-title">大米</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">我把手伸入厚实的大米<br>一堆粉一样的大米<br>一堆流热汗的大米<br>一堆秤杆边脱衣<br>视而不见的大米<br>以读罢昨夜的牡丹<br>以唤回性欲</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
