      <p class="poem-index-num">No. 25 of 51</p>
      <h1 class="poem-title">任航一种</h1>
      <div class="poem-body">
      <div class="poem-part">
        <div class="poem-part__label">一</div>
        <p class="poem-line">在海水中你看不出<br>一具澄澈的尸体<br>尸体过于澄澈<br>时间过于澄澈<br>不过<br>有只碧蓝的鸟<br>飞过<br>从一团揉皱了的<br>海水中<br>看到湿漉漉的<br>你</p>
      </div>
      <div class="poem-part">
        <div class="poem-part__label">二</div>
        <p class="poem-line">我会抱住一片下落的草丛<br>接住它<br>借一束镁光<br>讨今晚的第一支烟</p>
        <p class="poem-line">我会抱紧抱紧你的我<br>寓言在孔雀的孔中</p>
      </div>
      <div class="poem-part">
        <div class="poem-part__label">沼泽在水里</div>
        <p class="poem-line">涨红的性器宛若田地里亟待收割的庄稼<br>飞行中的飞机舱门打开<br>走出一个男人</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
