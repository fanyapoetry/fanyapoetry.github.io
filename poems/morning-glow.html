      <p class="poem-index-num">No. 48 of 51</p>
      <h1 class="poem-title">朝霞</h1>
      <div class="poem-epigraph">
        <p>尚有无数朝霞还未点燃我们的天空。</p>
      </div>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">我们还未认识红色，便已将它拿来使用，把它<br>堆上我们的画布：</p>
        <p class="poem-line">        一道卡在两腿之间的朝霞</p>
        <p class="poem-line">在诗里加了点糖，嫌不够，<br>你又提着婚礼的长裙，向他奔跑——</p>
        <p class="poem-line">        朝霞，只单单望着，就忘了落下</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
