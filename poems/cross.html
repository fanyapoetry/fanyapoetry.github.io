      <p class="poem-index-num">No. 13 of 51</p>
      <h1 class="poem-title">十字</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">屋子里的人正在熟睡<br>不远的牲畜棚，青烟腾起</p>
        <p class="poem-line">从滑梯下来，瘦弱的男人<br>屁股着地，弄折了十字</p>
        <p class="poem-line">“对我来说，哪里都是天堂。”<br>他循着丘陵，一颠一跛</p>
        <p class="poem-line">大地的盆骨松弛，发白的<br>种子，挨着跌入幽黑的裂缝</p>
        <p class="poem-line">他把褂子铺在旱地，收起几具<br>    鸟儿玲珑的尸骨</p>
        <p class="poem-line">田埂上，医生盘坐在救护车顶<br>马匹一动不动，念出我的名字</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
