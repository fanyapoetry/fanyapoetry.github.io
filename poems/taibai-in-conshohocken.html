      <p class="poem-index-num">No. 04 of 51</p>
      <h1 class="poem-title">太白在康斯霍肯</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">再回到宾州，是否仍是侠客？他大谈年轻时的游历，酒水单<br>藏匿着的身外身。太白，或是台北？谐音穿越今古，服务生<br>安利了一支本地的酒。觥筹交错，过往有如灌木般无关紧要。<br>他想起开去拳馆的路边，那群白尾鹿已经变得和冬天一样冷。</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
