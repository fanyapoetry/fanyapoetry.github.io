      <p class="poem-index-num">No. 17 of 51</p>
      <h1 class="poem-title">麻布手袋</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">在莫斯科的莫斯科书店<br>开着暖气的柜台墙上<br>挂售麻布手袋<br>用它装书 或晚灯下飘着的<br>密密的雪<br>我用简单的英语<br>挑选了一个中东样式的<br>为一段下雪的行程<br>为几本简单的书<br>它们并不轻 而且<br>与莫斯科没有关系</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
    </article>
