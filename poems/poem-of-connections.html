      <p class="poem-index-num">No. 44 of 51</p>
      <h1 class="poem-title">关联之诗</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">我要怀抱金鱼<br>我要喃喃自语<br>面对一篮水果，在桌子上<br>整整齐齐<br>我要梳理身体的每一寸<br>不毛之地<br>我要扯断风铃<br>我想要回我的手套<br>我希望有另一张面孔替我老去<br>我还想再见一见那匹犀牛<br>不是尤内斯库，<br>是我自己<br>烟灰缸里卧着的金鱼</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
