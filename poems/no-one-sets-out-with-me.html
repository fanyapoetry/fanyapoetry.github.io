      <p class="poem-index-num">No. 41 of 51</p>
      <h1 class="poem-title">没有人和我一起出发</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">没有人和我一起出发<br>马匹低头只思索自己的逃亡<br>一个雪天 一座悬崖也没有<br>没有一个人的领口<br>勾在梳得柔顺的新月上</p>
        <p class="poem-line">没有人和我一起出发<br>没有人要把流浪向我倾诉<br>没有人还留着旧居的墙砖<br>怀揣在口袋<br>一个人也没有</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
