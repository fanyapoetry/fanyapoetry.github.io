      <p class="poem-index-num">No. 39 of 55</p>
      <h1 class="poem-title">诗人的基因</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">我光辉的父辈们，<br>诗人的基因在他们身上<br>它表达为<br>烟鬼、秃顶，<br>和轻微的精神分裂症<br>并把整个后脑勺的忧郁<br>像丢烟蒂一般<br>丢给了我</p>
        <p class="poem-line">但我清楚 他们是诗人<br>即便他们不写诗<br>即便他们摇晃起身子<br>行走在雨中</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
