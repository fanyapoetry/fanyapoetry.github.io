      <p class="poem-index-num">No. 37 of 51</p>
      <h1 class="poem-title">轶事</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">在刚积起雪的院子里<br>搬一把竹椅，围成一个圆圈<br>八卦起那位戴雷锋帽的<br>老酒包，比如，打探他年轻时<br>如何，在灯下<br>索求她的一枚吻</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
