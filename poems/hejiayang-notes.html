      <p class="poem-index-num">No. 07 of 52</p>
      <h1 class="poem-title">何家洋手记</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line"><em>我们租用下墓园的清晨，以唤回必要的约定。</em></p>
        <p class="poem-line">从广袤的布置中醒来，天色还淡。何家洋的<br>公路，早于清早已通往昂贵的公墓。<br>犬吠深处，轮回如同往常，被惺忪地路过。</p>
        <p class="poem-line">我从后座下车，跨过松垮的田地。<br>垃圾焚烧，打磨出冰薄的远山。三菱重工<br>萎蔫。旁有机警的鹤，主持际遇的沼泽。</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
