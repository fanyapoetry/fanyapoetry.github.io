      <p class="poem-index-num">No. 31 of 51</p>
      <h1 class="poem-title">布列松的笔</h1>
      <div class="poem-body">
      <div class="poem-part">
        <p class="poem-line">布列松的笔还在燃烧<br>替代了沉重的蜡烛<br>烛油滴落在巴黎黄昏的白纸上</p>
        <p class="poem-line">布列松的笔注视着行人<br>行人的孤影 行人的交媾<br>行人的脸 像巴黎的雨一般飘落</p>
        <p class="poem-line">布列松的笔比绝育的镜头<br>更沉重，沉重的光线<br>快要把它折断</p>
        <p class="poem-line">一个人架起一生的幸运<br>一册影像在雨天重获姓名<br>把受难还给一个老人</p>
      </div>
      </div>
      <p class="poem-byline">&mdash; <strong>凡亞</strong></p>
